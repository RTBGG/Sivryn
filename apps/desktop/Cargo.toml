[package]
name = "sivryn-desktop"
description = "Sivryn desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]

sivryn-protocol.workspace = true
sivryn-client-core.workspace = true
sivryn-crypto.workspace = true
sivryn-media.workspace = true
dioxus-native.workspace = true
wgpu = "26"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite = { version = "0.39", features = ["bundled"] }
chacha20poly1305 = "0.11"
keyring = "4"
base64.workspace = true
getrandom = "0.4.3"
chrono = { workspace = true, features = ["clock"] }
thiserror.workspace = true
winit = { version = "0.30", default-features = false }
blitz-dom = { version = "0.2", default-features = false }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17.2"
reqwest = { workspace = true, features = ["json"] }
blitz-shell = { version = "0.2", default-features = false }
arboard = "3.7.0"
# Installer and updates (see src/updater.rs); ureq and ed25519-dalek are
# already in the tree through it and the crypto crates.
velopack = { version = "1.2.161", features = ["public-utils"] }
ureq = "3"
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
rustls.workspace = true
# Validates the video shader (already in the tree through wgpu).
naga = { version = "26", features = ["wgsl-in"] }
