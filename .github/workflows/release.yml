name: Release

# Pushing a tag like `v0.2.0` or `v0.2.0-alpha.1` builds the Windows client
# and the server image and publishes both. Tags with a pre-release suffix
# (anything after a `-`) become GitHub pre-releases and don't move `latest`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Windows desktop client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p sivryn-desktop

      - name: Package
        shell: bash
        run: |
          name="sivryn-desktop-${GITHUB_REF_NAME}-windows-x64.exe"
          mkdir dist
          cp target/release/sivryn-desktop.exe "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep notes of a release that was drafted by hand before tagging;
          # otherwise create one with generated notes.
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "Sivryn $GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  server-image:
    name: Server image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sivryn-server"
          version="${GITHUB_REF_NAME#v}"
          tags="$image:$version"
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags="$tags,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
