name: Release

# Pushing a tag like `v0.2.0` or `v0.2.0-alpha.1` builds the Windows client
# and the server image and publishes both. Tags with a pre-release suffix
# (anything after a `-`) become GitHub pre-releases and don't move `latest`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Windows desktop client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p sivryn-desktop

      # The tag's section of CHANGELOG.md: notes for the release and the update.
      - name: Release notes
        shell: bash
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [[ -s release-notes.md ]]; then cat release-notes.md; else echo "No CHANGELOG.md section for $GITHUB_REF_NAME."; fi

      - name: Package
        shell: bash
        run: |
          name="sivryn-desktop-${GITHUB_REF_NAME}-windows-x64.exe"
          mkdir dist
          cp target/release/sivryn-desktop.exe "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # Installer and updates (apps/desktop/src/updater.rs). vpk must match the
      # velopack crate's version.
      - name: Installer and update packages (Velopack)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is missing; clients only take signed updates."
            exit 1
          fi
          dotnet tool install -g vpk --version 1.2.161
          export PATH="$PATH:$HOME/.dotnet/tools"
          version="${GITHUB_REF_NAME#v}"
          mkdir publish releases
          cp target/release/sivryn-desktop.exe publish/
          # The previous release's package, so this one gets a small delta update.
          vpk download github --repoUrl "https://github.com/${GITHUB_REPOSITORY}" --pre \
            --token "$GH_TOKEN" --channel win --outputDir releases || echo "No earlier Velopack release."
          before=$(ls releases)
          vpk pack --packId Sivryn.Desktop --packVersion "$version" --packTitle Sivryn \
            --packAuthors RTBGG --packDir publish --mainExe sivryn-desktop.exe \
            --icon apps/desktop/assets/icons/sivryn.ico --channel win --outputDir releases \
            $( [[ -s release-notes.md ]] && echo --releaseNotes release-notes.md )
          # Sign the feed: the client ignores feeds without a valid signature.
          printf '%s\n' "$UPDATE_SIGNING_KEY" > signing-key.pem
          openssl pkeyutl -sign -rawin -inkey signing-key.pem \
            -in releases/releases.win.json -out releases/releases.win.json.sig
          rm signing-key.pem
          # Only what this version adds (earlier packages stay in their releases).
          for f in releases/*; do
            if ! grep -qxF "$(basename "$f")" <<< "$before" || [[ "$f" == *releases.win.json* ]]; then
              cp "$f" dist/
            fi
          done
          ls -l dist

      - name: Publish to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes from CHANGELOG.md; without a section, keep notes of a release
          # drafted by hand before tagging, or let GitHub generate them.
          notes=(--generate-notes)
          if [[ -s release-notes.md ]]; then
            notes=(--notes-file release-notes.md)
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --verify-tag "${notes[@]}" \
              --title "Sivryn $GITHUB_REF_NAME" "${flags[@]}"
          elif [[ -s release-notes.md ]]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  server-image:
    name: Server image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sivryn-server"
          version="${GITHUB_REF_NAME#v}"
          tags="$image:$version"
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            tags="$tags,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
