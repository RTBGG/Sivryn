# Sivryn for Coolify (https://coolify.io).
#
# In Coolify: New Resource → Public/Private Repository → Build Pack "Docker
# Compose", base directory "/", compose file "/deploy/docker-compose.coolify.yml".
# Then assign two domains under the services' settings:
#   sivryn   → https://chat.example.com      (port 8080)
#   livekit  → https://livekit.example.com   (port 7880)
#
# Coolify's proxy handles HTTPS for both. Secrets are generated by Coolify
# (SERVICE_PASSWORD_* variables). Only the WebRTC media ports are published
# directly, because the HTTP proxy cannot carry them: open 7881/tcp and
# 7882/udp in your firewall.

services:
  sivryn:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # Coolify routes the domain assigned to this service to port 8080.
      - SERVICE_URL_SIVRYN_8080
      - SIVRYN_DATABASE_URL=postgres://sivryn:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/sivryn
      # LiveKit's own domain; https:// is converted to wss:// by the server.
      - SIVRYN_LIVEKIT_URL=${SERVICE_URL_LIVEKIT}
      - LIVEKIT_API_KEY=sivryn
      - LIVEKIT_API_SECRET=${SERVICE_PASSWORD_64_LIVEKIT}
      - SIVRYN_INSTANCE_NAME=${SIVRYN_INSTANCE_NAME:-Sivryn}
      # open | invite_only | closed. The first account always becomes admin.
      - SIVRYN_REGISTRATION=${SIVRYN_REGISTRATION:-invite_only}
      - SIVRYN_SCREENSHARE_MAX_WIDTH=${SIVRYN_SCREENSHARE_MAX_WIDTH:-2560}
      - SIVRYN_SCREENSHARE_MAX_HEIGHT=${SIVRYN_SCREENSHARE_MAX_HEIGHT:-1440}
      - SIVRYN_SCREENSHARE_MAX_FPS=${SIVRYN_SCREENSHARE_MAX_FPS:-60}
      - SIVRYN_SCREENSHARE_MAX_BITRATE=${SIVRYN_SCREENSHARE_MAX_BITRATE:-12000000}
      - SIVRYN_SCREENSHARE_CODECS=${SIVRYN_SCREENSHARE_CODECS:-av1,h264}
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/sivryn-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sivryn
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=sivryn
    volumes:
      - sivryn-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivryn -d sivryn"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13
    restart: unless-stopped
    environment:
      # Coolify routes the domain assigned to this service to port 7880.
      - SERVICE_URL_LIVEKIT_7880
      - "LIVEKIT_KEYS=sivryn: ${SERVICE_PASSWORD_64_LIVEKIT}"
      # Inline config instead of a mounted file, so no repository files are
      # needed at runtime. Same settings as deploy/livekit.yaml.
      - |
        LIVEKIT_CONFIG=port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        turn:
          enabled: false
        room:
          empty_timeout: 300
        logging:
          level: info
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

volumes:
  sivryn-postgres:
